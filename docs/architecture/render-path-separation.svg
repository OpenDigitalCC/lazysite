<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 908" width="1280" height="908" role="img" aria-labelledby="ttl desc">
  <title id="ttl">lazysite architecture: one render path, a separate write plane</title>
  <desc id="desc">lazysite is at its core a Markdown-to-HTML renderer. Its render path (lazysite-processor.pl) loads no Lazysite modules and only reads files. Every other feature — MCP, Control API, WebDAV, OAuth, login, the manager UI and the CLI — is a separate authenticated component that writes files and shares the core libraries, and none of them runs in the render path.</desc>

  <defs>
    <style>
      text { font-family: -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .ey   { font-weight: 700; font-size: 13px; fill: #0F8A5C; letter-spacing: 2.5px; }
      .h1   { font-weight: 800; font-size: 31px; fill: #10171C; }
      .sub  { font-weight: 400; font-size: 15px; fill: #5B6770; }
      .pill { font-weight: 700; font-size: 12px; letter-spacing: 1px; fill: #FFFFFF; }
      .rlab { font-weight: 600; font-size: 12.5px; }
      .ct   { font-weight: 600; font-size: 15px; fill: #10171C; }
      .cs   { font-weight: 400; font-size: 11.5px; fill: #5B6770; }
      .foot { font-weight: 400; font-size: 12.5px; fill: #5B6770; }
      .fchip{ font-weight: 500; font-size: 12.5px; fill: #21282E; }
      .cap  { font-style: italic; font-weight: 400; font-size: 12px; fill: #8A949C; }
      .al   { font-weight: 700; font-size: 10.5px; letter-spacing: .5px; }
      .payh { font-weight: 700; font-size: 15px; fill: #10171C; }
      .payb { font-weight: 400; font-size: 13px; fill: #5B6770; }
      .tag  { font-weight: 700; font-size: 9.5px; letter-spacing: .5px; }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#10171C" flood-opacity="0.08"/>
    </filter>
    <marker id="arrFlow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8A949C"/></marker>
    <marker id="arrRead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F8A5C"/></marker>
    <marker id="arrWrite" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B4771F"/></marker>
    <symbol id="lock" viewBox="0 0 12 14">
      <path d="M3 6 V4.2 a3 3 0 0 1 6 0 V6" fill="none" stroke="#B4771F" stroke-width="1.5"/>
      <rect x="1.4" y="6" width="9.2" height="7.2" rx="1.6" fill="#B4771F"/>
    </symbol>
  </defs>

  <rect width="1280" height="908" fill="#FFFFFF"/>

  <!-- Header -->
  <text class="ey"  x="48" y="52">ENGINE ARCHITECTURE</text>
  <text class="h1"  x="48" y="88">One render path. A separate write plane.</text>
  <text class="sub" x="48" y="116">At its core, lazysite is a Markdown-to-HTML renderer. Every other feature is a separate, authenticated component that writes</text>
  <text class="sub" x="48" y="137">files — sharing the core libraries, never sitting in the request path.</text>

  <!-- ============ RENDER PATH ============ -->
  <rect x="40" y="164" width="1200" height="182" rx="16" fill="#EAF6F0" stroke="#BFE3D2"/>
  <rect x="64" y="184" rx="10" width="152" height="24" fill="#0F8A5C"/>
  <text class="pill" x="78" y="200">THE RENDER PATH</text>
  <text class="rlab" x="1216" y="200" text-anchor="end" fill="#0B6E48">always on&#160;·&#160;public&#160;·&#160;unauthenticated</text>

  <!-- render chips (y 232, h 88) -->
  <!-- c1 Visitor -->
  <g filter="url(#soft)"><rect x="67"   y="232" width="194" height="88" rx="11" fill="#FFFFFF" stroke="#BFE3D2"/></g>
  <text class="ct" x="164" y="272" text-anchor="middle">Visitor</text>
  <text class="cs" x="164" y="292" text-anchor="middle">a public browser</text>
  <!-- c2 Web server -->
  <g filter="url(#soft)"><rect x="305"  y="232" width="194" height="88" rx="11" fill="#FFFFFF" stroke="#BFE3D2"/></g>
  <text class="ct" x="402" y="272" text-anchor="middle">Web server</text>
  <text class="cs" x="402" y="292" text-anchor="middle">Apache / nginx</text>
  <!-- c3 processor (the star) -->
  <g filter="url(#soft)"><rect x="543"  y="226" width="194" height="100" rx="11" fill="#FFFFFF" stroke="#0F8A5C" stroke-width="2"/></g>
  <rect x="592" y="216" rx="8" width="96" height="19" fill="#0F8A5C"/>
  <text class="tag" x="640" y="229" text-anchor="middle" fill="#FFFFFF">THE ENGINE</text>
  <text class="ct mono" x="640" y="270" text-anchor="middle" font-size="13.5px">lazysite-</text>
  <text class="ct mono" x="640" y="288" text-anchor="middle" font-size="13.5px">processor.pl</text>
  <text class="cs" x="640" y="308" text-anchor="middle">the one always-on CGI</text>
  <!-- c4 md+tt -->
  <g filter="url(#soft)"><rect x="781"  y="232" width="194" height="88" rx="11" fill="#FFFFFF" stroke="#BFE3D2"/></g>
  <text class="ct" x="878" y="268" text-anchor="middle">Markdown&#160;+&#160;Templates</text>
  <text class="cs mono" x="878" y="290" text-anchor="middle">Text::MultiMarkdown · Template</text>
  <!-- c5 html -->
  <g filter="url(#soft)"><rect x="1019" y="232" width="194" height="88" rx="11" fill="#FFFFFF" stroke="#BFE3D2"/></g>
  <text class="ct" x="1116" y="272" text-anchor="middle">HTML page</text>
  <text class="cs" x="1116" y="292" text-anchor="middle">served to the visitor</text>

  <!-- render flow arrows -->
  <line x1="265" y1="276" x2="299" y2="276" stroke="#8A949C" stroke-width="1.6" marker-end="url(#arrFlow)"/>
  <text class="al" x="282" y="266" text-anchor="middle" fill="#8A949C">GET</text>
  <line x1="503" y1="276" x2="537" y2="276" stroke="#8A949C" stroke-width="1.6" marker-end="url(#arrFlow)"/>
  <text class="al" x="520" y="266" text-anchor="middle" fill="#8A949C">ROUTE</text>
  <line x1="741" y1="276" x2="775" y2="276" stroke="#8A949C" stroke-width="1.6" marker-end="url(#arrFlow)"/>
  <text class="al" x="758" y="266" text-anchor="middle" fill="#8A949C">RENDER</text>
  <line x1="979" y1="276" x2="1013" y2="276" stroke="#8A949C" stroke-width="1.6" marker-end="url(#arrFlow)"/>
  <text class="al" x="996" y="266" text-anchor="middle" fill="#8A949C">EMIT</text>

  <text class="foot" x="64" y="336"><tspan font-weight="700" fill="#0B6E48">Loads no Lazysite modules.</tspan> Two libraries do the work — no authentication or management code runs in the request path.</text>

  <!-- read arrow (files -> engine) -->
  <line x1="640" y1="370" x2="640" y2="350" stroke="#0F8A5C" stroke-width="2" marker-end="url(#arrRead)"/>
  <text class="al" x="654" y="365" fill="#0B6E48">READS</text>

  <!-- ============ FILESYSTEM ============ -->
  <rect x="40" y="372" width="1200" height="94" rx="14" fill="#F5F7F6" stroke="#D5DBD8"/>
  <text x="64" y="399" font-weight="700" font-size="12px" letter-spacing="1px" fill="#5B6770">THE FILESYSTEM</text>
  <text x="192" y="399" font-size="12px" fill="#8A949C">·&#160;the interface between the two planes</text>
  <text class="cap" x="1216" y="399" text-anchor="end">the render path only reads it&#160;·&#160;everything else only writes it</text>

  <!-- file chips (y 416, h 34) -->
  <g class="mono">
    <rect x="64"  y="416" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="130" y="437" text-anchor="middle">content/*.md</text>
    <rect x="208" y="416" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="283" y="437" text-anchor="middle">*.conf&#160;/&#160;domains</text>
    <rect x="370" y="416" width="92"  height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="416" y="437" text-anchor="middle">themes/</text>
    <rect x="474" y="416" width="96"  height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="522" y="437" text-anchor="middle">layouts/</text>
    <rect x="582" y="416" width="96"  height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="630" y="437" text-anchor="middle">nav.conf</text>
    <rect x="690" y="416" width="84"  height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="732" y="437" text-anchor="middle">forms/</text>
    <rect x="786" y="416" width="96"  height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="834" y="437" text-anchor="middle">aliases</text>
    <rect x="894" y="416" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#E7EBE9"/><text class="fchip" x="950" y="437" text-anchor="middle">media / _drafts</text>
  </g>

  <!-- write arrows (plane -> files) -->
  <line x1="320" y1="498" x2="320" y2="470" stroke="#B4771F" stroke-width="2" marker-end="url(#arrWrite)"/>
  <line x1="640" y1="498" x2="640" y2="470" stroke="#B4771F" stroke-width="2" marker-end="url(#arrWrite)"/>
  <line x1="960" y1="498" x2="960" y2="470" stroke="#B4771F" stroke-width="2" marker-end="url(#arrWrite)"/>
  <text class="al" x="640" y="489" text-anchor="middle" fill="#8A5A12">WRITES</text>

  <!-- ============ CONTROL PLANE ============ -->
  <rect x="40" y="500" width="1200" height="256" rx="16" fill="#FBF1DF" stroke="#EAD6A8"/>
  <rect x="64" y="520" rx="10" width="232" height="24" fill="#B4771F"/>
  <text class="pill" x="78" y="536">AUTHORING &amp; CONTROL PLANE</text>
  <text class="rlab" x="1216" y="536" text-anchor="end" fill="#8A5A12">separate&#160;·&#160;authenticated&#160;·&#160;off by default</text>

  <!-- component chips (y 560, h 86) width 150 gap 16 start 67 -->
  <g>
    <g filter="url(#soft)"><rect x="67"   y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="136" y="574" width="12" height="14"/><text class="ct" x="142" y="614" text-anchor="middle">MCP</text><text class="cs mono" x="142" y="632" text-anchor="middle" font-size="10.5px">lazysite-mcp.pl</text>

    <g filter="url(#soft)"><rect x="233"  y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="302" y="574" width="12" height="14"/><text class="ct" x="308" y="614" text-anchor="middle">Control API</text><text class="cs mono" x="308" y="632" text-anchor="middle" font-size="10px">…-manager-api.pl</text>

    <g filter="url(#soft)"><rect x="399"  y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="468" y="574" width="12" height="14"/><text class="ct" x="474" y="614" text-anchor="middle">WebDAV</text><text class="cs mono" x="474" y="632" text-anchor="middle" font-size="10.5px">lazysite-dav.pl</text>

    <g filter="url(#soft)"><rect x="565"  y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="634" y="574" width="12" height="14"/><text class="ct" x="640" y="614" text-anchor="middle">OAuth</text><text class="cs mono" x="640" y="632" text-anchor="middle" font-size="10.5px">lazysite-oauth.pl</text>

    <g filter="url(#soft)"><rect x="731"  y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="800" y="574" width="12" height="14"/><text class="ct" x="806" y="614" text-anchor="middle">Login</text><text class="cs mono" x="806" y="632" text-anchor="middle" font-size="10.5px">lazysite-auth.pl</text>

    <g filter="url(#soft)"><rect x="897"  y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="966" y="574" width="12" height="14"/><text class="ct" x="972" y="614" text-anchor="middle">Manager UI</text><text class="cs mono" x="972" y="632" text-anchor="middle" font-size="11px">/manager/</text>

    <g filter="url(#soft)"><rect x="1063" y="560" width="150" height="86" rx="11" fill="#FFFFFF" stroke="#EAD6A8"/></g>
    <use href="#lock" x="1132" y="574" width="12" height="14"/><text class="ct" x="1138" y="614" text-anchor="middle">CLI tools</text><text class="cs mono" x="1138" y="632" text-anchor="middle" font-size="10.5px">tools/lazysite-*</text>
  </g>

  <!-- shared core libs bar (y 662 h 44) -->
  <rect x="67" y="662" width="1146" height="46" rx="10" fill="#FFFFFF" stroke="#EAD6A8"/>
  <text x="88" y="690" font-weight="700" font-size="11.5px" letter-spacing="1px" fill="#8A5A12">SHARED CORE LIBS</text>
  <text class="mono" x="238" y="690" font-size="12.5px" fill="#5B6770">Auth&#160;·&#160;Capabilities&#160;·&#160;Manager::{Files · Domains · Themes · Layouts · Plugins · …}&#160;·&#160;Audit&#160;·&#160;Util</text>

  <text class="foot" x="64" y="738" fill="#8A5A12">Each is a distinct entrypoint. They share the libraries and write to files — <tspan font-weight="700">none of them runs in the render path.</tspan></text>

  <!-- ============ WHY IT MATTERS ============ -->
  <line x1="48" y1="784" x2="1232" y2="784" stroke="#E7EBE9" stroke-width="1"/>
  <!-- col 1 -->
  <rect x="48" y="806" width="12" height="12" rx="3" fill="#0F8A5C"/>
  <text class="payh" x="70" y="817">Smaller attack surface</text>
  <text class="payb" x="48" y="843">The only always-on, unauthenticated path</text>
  <text class="payb" x="48" y="861">loads two libraries and no write code.</text>
  <!-- col 2 -->
  <rect x="448" y="806" width="12" height="12" rx="3" fill="#B4771F"/>
  <text class="payh" x="470" y="817">Faster renders</text>
  <text class="payb" x="448" y="843">No authentication or management</text>
  <text class="payb" x="448" y="861">machinery runs per request.</text>
  <!-- col 3 -->
  <rect x="848" y="806" width="12" height="12" rx="3" fill="#5B6770"/>
  <text class="payh" x="870" y="817">Easier to evolve</text>
  <text class="payb" x="848" y="843">Separation of concerns: components change</text>
  <text class="payb" x="848" y="861">without touching the renderer.</text>
</svg>
