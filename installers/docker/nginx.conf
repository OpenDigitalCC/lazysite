# lazysite container: nginx as an unprivileged user (SM1233). The server block
# is conf.d/lazysite.conf, made at build time from
# installers/nginx/vhost-one-rule-pool.conf.example.
#
# Nothing here needs root: the pid and the temp paths are under /tmp, the port is
# above 1024, and the logs go to the container's streams.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    server_tokens off;
    sendfile on;

    include /etc/nginx/conf.d/*.conf;
}
