# lazysite container: nginx as an unprivileged user (SM1233, SM1361). The
# server blocks are made at start by the entrypoint, one per site listed in
# /srv/sites/sites.conf, from installers/nginx/vhost-one-rule-pool.conf.example,
# into /tmp/nginx/sites (the root filesystem is read-only). A site that is not
# serving gets a block answering 503; a host no site names, 404.
#
# Nothing here needs root: the pid and the temp paths are under /tmp, the port is
# above 1024, and the logs go to the container's streams. Plain HTTP: TLS is the
# operator's own proxy in front (ruling 205; front.conf.example).
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    server_tokens off;
    sendfile on;
    server_names_hash_bucket_size 128;

    include /tmp/nginx/sites/*.conf;
}
