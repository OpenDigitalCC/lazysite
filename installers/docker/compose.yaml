# lazysite in Docker Compose (SM1233, SM1361): one container, many sites. nginx,
# and each site's one-rule FastCGI pool and persistent runtime, in one container;
# the engine is the image, read-only; the sites are folders in one volume,
# listed in its sites.conf. Built locally from the unpacked release tarball;
# nothing is pulled from or pushed to a registry (the base image,
# debian:trixie-slim, is the one pull).
#
#   docker compose build
#   docker compose up -d
#   docker compose exec lazysite lazysite-sites add example example.com www.example.com
#   docker compose exec lazysite lazysite-sites sysop example NAME
#   docker compose exec lazysite lazysite-sites status
#
# Plain HTTP on loopback: TLS and the public names are your own proxy's
# (front.conf.example). See README.md in this directory.
name: lazysite

services:
  lazysite:
    build:
      # The unpacked tarball: this file is installers/docker/compose.yaml in it.
      context: ../..
      dockerfile: installers/docker/Dockerfile
    # The tag is the upgrade: build the new release under a new tag, set it
    # here (or in .env) and `docker compose up -d` (README.md, Upgrade).
    image: ${LAZYSITE_IMAGE:-lazysite:local}
    restart: unless-stopped
    ports:
      # Loopback by default: TLS and the public names belong to the proxy in
      # front. LAZYSITE_BIND=0.0.0.0 to expose it.
      - "${LAZYSITE_BIND:-127.0.0.1}:${LAZYSITE_PORT:-8080}:8080"
    environment:
      # Each site's pool size (ruling 208: worker caps are the per-site limit).
      LAZYSITE_WORKERS: ${LAZYSITE_WORKERS:-2}
    volumes:
      # The one volume: a folder per site, and sites.conf. The engine is in the image.
      - lazysite-sites:/srv/sites
    # The image is read-only: the container writes only the volume and these.
    read_only: true
    # Ruling 220: compose mounts a bare tmpfs entry root-owned 0755, which the
    # www-data processes cannot write, so each says whose it is. /run/lazysite
    # holds the supervisor's pid, each site's status and every pool's socket;
    # /tmp holds nginx's temp and server-block directories. The entrypoint
    # refuses to start when it cannot write them, naming this.
    tmpfs:
      - /tmp:mode=1777
      - /run/lazysite:uid=33,gid=33,mode=0770
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/lazysite-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Every process runs as www-data and needs nothing from root (ruling 210).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  lazysite-sites:
