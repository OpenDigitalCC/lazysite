# sale_stock pack, Odoo 19: what a confirm of a sale order reserved (sale.confirm reads it after the action): the stock moves
# of the order's lines and their move lines. The reservation is the move line's quantity_product_uom, in the product's unit of measure (16 carries reserved_qty).
pack: sale_stock
series: 19
module: sale_stock
models:
  move:
    model: stock.move
    fields:
      sale_line: sale_line_id
      product: product_id
      demand: product_qty
      state: state
  move_line:
    model: stock.move.line
    fields:
      move: move_id
      lot: lot_id
      location: location_id
      reserved: quantity_product_uom
