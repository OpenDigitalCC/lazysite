# Sale pack, Odoo 16: the state operations sale.confirm and sale.cancel on sale.order. Read from the 16.0 source (sale/models/sale_order.py) and proved live by t/49-documents-pack-live.t.
pack: sale
series: 16
module: sale
actions:
  confirm: action_confirm
  cancel: action_cancel
  draft: action_draft
models:
  order:
    model: sale.order
    fields:
      name: name
      state: state
      partner: partner_id
      locked: ~
states:
  confirm:
    # action_confirm; done is where the company locks on confirmation
    from: [draft, sent]
    to: [sale, done]
    hints:
      cancel: "oom-ops run sale.cancel --set order={id} --set draft=1 makes it a draft again, then confirm it"
      done: "it is locked and already confirmed"
  cancel:
    # action_cancel opens the sale.order.cancel wizard for a non-draft order on 16 and 18 unless disable_cancel_warning is in the context
    from: [draft, sent, sale]
    to: [cancel]
    context: { disable_cancel_warning: true }
    hints:
      done: "a locked order is unlocked in Odoo first (OOM has no operation for it)"
  draft:
    # action_draft; only the way back after a cancel is used (sale.cancel draft=1)
    from: [cancel, sent]
    to: [draft]
