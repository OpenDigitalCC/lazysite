# res.partner, Odoo 19. Read in the 19.0 source (OCB 19.0, commit
# 8aa2b0a27) and met on the local 19 instance (demo.localhost, base_vat
# installed) by t/92-partner-behaviour-live.t on 2026-10-13, 28 checks.
# What changed from 16 to 18: a vat written on a contact and a contact's
# address now travel UP to the company, and the Tax ID check does nothing
# for a partner with no country.
model: res.partner
series: 19
effects:
  - on: create
    fields: [parent_id]
    effect: a contact (type contact) created under a company takes the company's address at once, and any commercial field set on the company is copied onto it
    evidence: live 2026-10-13 (address); source 19.0 res_partner._fields_sync (1a, 1b)
  - on: write
    fields: [street, street2, zip, city, state_id, country_id]
    effect: copies the address to every child of type contact; children of another type keep their own. Changed from 18, an address written on a contact (type contact, with a parent) also travels UP and is written on the parent
    evidence: live 2026-10-13 (street on a company reached its contact, not its delivery address; street on the contact was taken by the company); source 19.0 res_partner._fields_sync step 2 ("To UPSTREAM")
  - on: write
    fields: [vat]
    effect: Changed from 18, vat is a synchronised commercial field (_synced_commercial_fields), so written on a contact it is written on the commercial entity, and from there on all its descendants that are not companies, replacing what they had
    evidence: live 2026-10-13 (vat written on a contact was taken by the company; a vat then written on the company replaced the contact's and the delivery address's); source 19.0 res_partner._synced_commercial_fields, _fields_sync, _commercial_sync_to_descendants
  - on: write
    fields: [company_registry, industry_id]
    effect: written on a commercial entity the value is copied to all its descendants that are not companies; written on a contact it stays there (only vat goes up)
    evidence: source 19.0 res_partner._commercial_fields (the synced list is vat only); not met live
  - on: write
    fields: [vat, country_id]
    effect: with base_vat installed a Tax ID that fails its country's check is refused at create and write when the partner has a country; a partner with no country is not checked at all (16 and 18 still check the number's own country prefix). no_vat_validation skips the check
    requires: { "module:base_vat": installed }
    evidence: live 2026-10-13 (invalid BE number refused at write and create with a country, ACCEPTED with none, accepted under no_vat_validation); source 19.0 base_vat _run_vat_checks (returns at once when there is no country or no vat). core.import did not meet this, since TEST-RESULTS holds no record of a Tax ID refusal on 19
  - on: write
    fields: [is_company, company_type]
    effect: company_type is only an interface to is_company; writing it writes is_company
    evidence: live 2026-10-13; source 19.0 res_partner._compute_company_type / _write_company_type
  - on: write
    fields: [is_company, parent_id]
    effect: commercial_partner_id (stored) recomputes to the partner itself for a company or a partner with no parent, else to its parent's commercial partner
    evidence: live 2026-10-13; source 19.0 res_partner._compute_commercial_partner
  - on: write
    fields: [name, parent_id, is_company]
    effect: display_name recomputes; a contact of a company reads "Company, Contact" and follows the company's rename
    evidence: live 2026-10-13 (19 also keeps a stored complete_name, res_partner._compute_complete_name)
  - on: write
    fields: [website]
    effect: a value without a scheme is stored with http:// in front
    evidence: live 2026-10-13; source 19.0 res_partner._clean_website
  - on: write
    fields: [email]
    effect: email_normalized recomputes, lower-cased, empty when the text is not an address; a malformed address is stored as written
    evidence: live 2026-10-13
  - on: create
    fields: [parent_id]
    effect: the first contact created under a company with no address makes its own address the company's
    evidence: source 19.0 res_partner._handle_first_contact_creation; not met live
  - on: write
    fields: [parent_id]
    effect: company_name is cleared when a parent is set
    evidence: source 19.0 res_partner.create / write; not met live
probes: ["module:base_vat", "module:contacts"]
