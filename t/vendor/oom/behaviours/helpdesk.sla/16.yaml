model: helpdesk.sla
series: 16
module: helpdesk_mgmt_sla
effects: []
actions:
  - method: check_sla
    on: model
    note: sets sla_deadline and sla_expired on every open ticket a rule fits (the first rule that fits, in the order Odoo finds them); the module's own cron calls it every 5 minutes. A ticket made after the rule has no deadline until it runs
