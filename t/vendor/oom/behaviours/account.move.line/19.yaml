# account.move.line, Odoo 19 (account). Read from the 19.0 source (account/models/account_move_line.py); the parent hold is met live by t/49-documents-pack-live.t.
model: account.move.line
series: 19
unlink_requires:
  parent: move_id
  state:
  - draft
  - cancel
  noun: move
effects:
- 'on': call
  method: unlink
  effect: Odoo deletes a line while its move is draft or cancel; a line of a posted move is refused ("You cannot delete an item linked to a posted entry"; reset the move to draft first). Tax and payment-term lines are also refused unless the context carries dynamic_unlink, and a reconciled line is refused. A line with a zero balance and no amount in currency is deleted from a posted move too (the check reads only the non-zero lines); the revert holds those as well A move that is hashed (inalterable_hash) refuses all of its lines.
  evidence: source 19.0 account_move_line._unlink_except_posted (a non-zero line of a posted move), _except_hashed_entry_lines; live 2026-10-16 t/49-documents-pack-live.t on 19 (the refusal of a line of a posted move and the deletion after account.draft)
