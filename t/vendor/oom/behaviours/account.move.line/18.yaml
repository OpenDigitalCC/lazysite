# account.move.line, Odoo 18 (account). Read from the 18.0 source (account/models/account_move_line.py); the parent hold is met live by t/49-documents-pack-live.t.
model: account.move.line
series: 18
unlink_requires:
  parent: move_id
  state:
  - draft
  - cancel
  noun: move
effects:
- 'on': call
  method: unlink
  effect: Odoo deletes a line while its move is draft or cancel; a line of a posted move is refused ("You cannot delete an item linked to a posted entry"; reset the move to draft first). Tax and payment-term lines are also refused unless the context carries dynamic_unlink, and a reconciled line is refused. A line with a zero balance and no amount in currency is deleted from a posted move too (the check reads only the non-zero lines); the revert holds those as well A move that is hashed (inalterable_hash) refuses all of its lines.
  evidence: source 18.0 account_move_line._unlink_except_posted (a non-zero line of a posted move), _except_hashed_entry_lines; live 2026-10-16 t/49-documents-pack-live.t on 18 (the refusal of a line of a posted move and the deletion after account.draft)
- 'on': call
  method: reconcile
  effect: Odoo matches the items against each other and makes the partial reconciles (account.partial.reconcile) joining debit to credit up to the smaller residual; when nothing is left open on any item of the group it makes the full reconcile, and each item reads reconciled with a matching_number. matching_number is the full reconcile's id as text (9) or P and a number for each connected group of partials; reconcile() answers nothing. Odoo refuses an item already reconciled, an account that does not allow reconciliation, an entry that is not posted, and items of two companies or two accounts, in its own words.
  evidence: source 18.0 account_move_line.reconcile; live 2026-10-21 t/153-acct40-live.t on 18 (a full reconcile, a partial one against a larger payment, and the refusals through account.reconcile)
- 'on': call
  method: remove_move_reconcile
  effect: Odoo unlinks every partial reconcile the items hold, and with them the full reconcile they belonged to; the items read open again with their residual back and no matching_number. The other items those partials joined are released as well.
  evidence: source 18.0 account_move_line.remove_move_reconcile; live 2026-10-21 t/153-acct40-live.t on 18 (account.unreconcile and the revert of account.reconcile)
