# purchase.order.line, Odoo 19 (purchase). Read from the 19.0 source (purchase/models/purchase_order_line.py); the parent hold is met live by t/49-documents-pack-live.t.
model: purchase.order.line
series: 19
unlink_requires:
  parent: order_id
  state:
  - draft
  - sent
  - to approve
  - cancel
  noun: order
effects:
- 'on': call
  method: unlink
  effect: Odoo deletes a line while its order is in draft, sent, to approve or cancel; once the order is purchase it is refused (Cannot delete a purchase order line which is in state ...). Sections and notes are always deleted; the revert holds them with the rest
  evidence: source 19.0 purchase_order_line._unlink_except_purchase (order state purchase; sections and notes exempt); live 2026-10-16 t/49-documents-pack-live.t on 19 (the refusal of a line of a confirmed order and the deletion after purchase.cancel)
