# mail.activity, Odoo 19. Read in the 19.0 source (OCB 19.0, commit
# 8aa2b0a27); the local 19 instance was reached on 2026-10-13 but no
# activity was assigned there, so nothing in this file is "live".
model: mail.activity
series: 19
effects:
  - on: create
    fields: [user_id]
    effect: emails "activity assigned" to the assignee when the assignee is not the acting user; the acting user needs no email address
    suppress: { context: { mail_activity_quick_update: true } }
    evidence: source 19.0 mail_activity.create and mail_thread._message_compute_author (no longer raises); the same author rule is live 2026-10-13 on 19 for a lead note and a lead assignment, not for an activity
  - on: write
    fields: [user_id]
    effect: emails the new assignee when it is not the acting user
    suppress: { context: { mail_activity_quick_update: true } }
    evidence: source 19.0 mail_activity.write
  - on: create
    fields: [user_id]
    effect: does not refuse an assignee who cannot read the record (16 did, for a non-automated activity)
    evidence: source 19.0 mail_activity (no _check_access_assignation)
  - on: call
    method: action_feedback
    effect: marks the activity done, posts the feedback on the record's chatter and archives the activity (always); the next activity of the chain is created when its chaining type is trigger
    evidence: source 19.0 mail_activity.action_feedback / _action_done; inherited from 16 for the chain, not traced
actions:
  - method: action_feedback
    done_as: archived
    creates:
      - model: mail.message
      - model: mail.activity
    creates_evidence: 'source 19.0 mail_activity._action_done (the done note is a mail.message on the record; the next activity is created when chaining_type is trigger); not probed live in this change (19 reachable but not asked)'
    note: 'kwargs feedback (text, shown in the note) and attachment_ids (list of ir.attachment ids); pass them in --set args as a JSON object, {"feedback":"..."}. Done: always archived (keep_done no longer exists on the type; the feedback text is stored on the activity''s feedback field). Access: the records are browsed with sudo, so an assignee without rights on the record may close their own activity; the activity is archived under the activity''s own record rule. The signed-in user (or the person acted for) runs the call. There is no revert.'
    evidence: 'source 19.0 mail_activity.action_feedback / _action_done; not probed live in this change (19 reachable but not asked)'
  - method: action_done
    done_as: archived
    creates:
      - model: mail.message
      - model: mail.activity
    creates_evidence: 'source 19.0 mail_activity.action_done (action_feedback with no feedback); not probed live in this change (19 reachable but not asked)'
    note: 'action_feedback without a feedback text. Done: always archived (keep_done no longer exists on the type; the feedback text is stored on the activity''s feedback field). Access as for action_feedback. There is no revert.'
    evidence: 'source 19.0 mail_activity.action_done; not probed live in this change (19 reachable but not asked)'
routes:
  schedule: { via: activity_schedule, args: { automated: false }, why: marks the activity as not automated so the mixin's automated helpers leave it alone (activity_search takes only_automated in 19.0); the assignee-access check it once skipped is gone }
probes: []
