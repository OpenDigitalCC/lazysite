# mail.activity, Odoo 18. Read in the 18.0 source (OCB 18.0, commit
# 51565b7c7); the local 18 instance was reached on 2026-10-13 but no
# activity was assigned there, so nothing in this file is "live".
model: mail.activity
series: 18
effects:
  - on: create
    fields: [user_id]
    effect: emails "activity assigned" to the assignee when the assignee is not the acting user; the acting user must have an email address
    requires: { acting_user_email: 1 }
    suppress: { context: { mail_activity_quick_update: true } }
    evidence: source 18.0 mail_activity.create and mail_thread._message_compute_author (raises without a sender email; live 2026-10-13 on 18 for a lead note and a lead assignment, not for an activity)
  - on: write
    fields: [user_id]
    effect: emails the new assignee when it is not the acting user
    requires: { acting_user_email: 1 }
    suppress: { context: { mail_activity_quick_update: true } }
    evidence: source 18.0 mail_activity.write
  - on: create
    fields: [user_id]
    effect: does not refuse an assignee who cannot read the record (16 did, for a non-automated activity)
    evidence: source 18.0 mail_activity (no _check_access_assignation; access is decided by _check_access on the related document)
  - on: call
    method: action_feedback
    effect: marks the activity done, posts the feedback on the record's chatter and deletes the activity, or archives it when its type keeps done activities; the next activity of the chain is created when its chaining type is trigger
    evidence: source 18.0 mail_activity.action_feedback / _action_done; inherited from 16 for the chain, not traced
actions:
  - method: action_feedback
    done_as: keep_done
    creates:
      - model: mail.message
      - model: mail.activity
    creates_evidence: 'source 18.0 mail_activity._action_done (the done note is a mail.message on the record; the next activity is created when chaining_type is trigger); live 2026-10-29 t/166-people43-live.t on 18'
    note: 'kwargs feedback (text, shown in the note) and attachment_ids (list of ir.attachment ids); pass them in --set args as a JSON object, {"feedback":"..."}. Done: archived when the activity type has keep_done, deleted otherwise. Access: the records are browsed with sudo, so an assignee without rights on the record may close their own activity; the activity itself is unlinked or archived under the activity''s own record rule (write/unlink for the assignee or creator) and _check_access (a user who may not write the record may still write or unlink an activity assigned to them). The signed-in user (or the person acted for) runs the call. There is no revert.'
    evidence: 'source 18.0 mail_activity.action_feedback / _action_done; live 2026-10-29 t/166-people43-live.t on 18'
  - method: action_done
    done_as: keep_done
    creates:
      - model: mail.message
      - model: mail.activity
    creates_evidence: 'source 18.0 mail_activity.action_done (action_feedback with no feedback); live 2026-10-29 t/166-people43-live.t on 18'
    note: 'action_feedback without a feedback text. Done: archived when the activity type has keep_done, deleted otherwise. Access as for action_feedback. There is no revert.'
    evidence: 'source 18.0 mail_activity.action_done; live 2026-10-29 t/166-people43-live.t on 18'
routes:
  schedule: { via: activity_schedule, args: { automated: false }, why: marks the activity as not automated so the mixin's automated helpers leave it alone; the assignee-access check it once skipped is gone }
probes: [acting_user_email]
