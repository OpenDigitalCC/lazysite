# What crm.lead does when touched, Odoo 19. Read in the 19.0 source
# (OCB 19.0, 2026-09-23, commit 8aa2b0a27) and met on the local 19
# instance (demo.localhost) on 2026-10-13 by tmp/probe-noemail.pl.
# The big change from 18: a sender without an email address no longer
# stops a post or a notification.
model: crm.lead
series: 19
effects:
  - on: create
    fields: [user_id]
    effect: emails the assignee "you have been assigned" from the acting user; the acting user needs no email address
    suppress: { context: { mail_auto_subscribe_no_notify: true } }
    evidence: live 2026-10-13 on 19 (a lead created for another salesperson by an admin with no email was ACCEPTED, with and without mail_auto_subscribe_no_notify); source 19.0 mail_thread._message_compute_author (no raise_on_email, no "Unable to send message")
  - on: write
    fields: [user_id]
    effect: emails the new assignee from the acting user
    suppress: { context: { mail_auto_subscribe_no_notify: true } }
    evidence: source 19.0 mail_thread._message_auto_subscribe_notify; the create case is live on 19 (above), the write case is not separately probed
  - on: write
    fields: [stage_id, team_id, street, city, zip, country_id, email_from, phone, source_id, medium_id, campaign_id, tag_ids, lang_id]
    effect: re-scores automated_probability; a lead whose probability equals its automated score follows the new score. The fields that trigger it are stage_id, team_id and the list in the system parameter crm.pls_fields (the list here is the usual default)
    evidence: source 19.0 crm_lead._compute_probabilities (depends on stage_id, team_id and _pls_get_safe_fields()); not re-scored live on 19
  - on: call
    method: action_unarchive
    effect: clears lost_reason_id and re-scores the lead. Changed from 18, the rule moved from toggle_active (the method is gone from the lead) into action_unarchive itself
    evidence: source 19.0 crm_lead.action_unarchive
  - on: write
    fields: [website]
    effect: normalises the value to http://...
    evidence: source 19.0 crm_lead.create / write via res.partner._clean_website
routes:
  log_note: { via: mail.message.create, why: a note is created directly on every series, which needs no sender address. On 19 message_post would also do (live 2026-10-13: ACCEPTED with an admin who has no email), so a file may name that route instead }
  schedule_todo: { via: activity_schedule, args: { automated: false }, why: marks the activity as not automated, so the mixin's automated helpers (activity_search only_automated, reschedule, feedback, unlink) leave it alone. The assignee-access check this once skipped is gone from mail.activity in 19.0 }
# send_email: none. The composer's auto_delete_message field is gone
# since 17.0 (auto_delete / auto_delete_keep_log in 19.0 too), so
# comms.send's composer call is 16 only.
probes: [acting_user_email, "module:crm_iap_mine", "module:base_install_request"]
invariants:
  - name: probability-manual
    pack: crm
    text: no open lead's probability equals its automated_probability (the daily cron would re-score it)
    check: count
    model: crm.lead
    domain: [["active", "=", true], ["probability", "=", { field: automated_probability }]]
    expect: 0
