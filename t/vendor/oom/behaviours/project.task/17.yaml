# project.task, Odoo 17: the assignment mail. Read in the OCB 17.0 source (addons/project/models/project_task.py); not run on a live instance (17 is not reachable).
model: project.task
series: 17
module: project
effects:
  - on: create
    fields: [user_ids]
    effect: emails each assignee other than the acting user "You have been assigned to <task>"
    suppress: { context: { mail_auto_subscribe_no_notify: true } }
