# sale.order.line, Odoo 19 (sale). Read from the 19.0 source (sale/models/sale_order_line.py); the parent hold is met live by t/49-documents-pack-live.t.
model: sale.order.line
series: 19
unlink_requires:
  parent: order_id
  state:
  - draft
  - sent
  - cancel
  noun: order
effects:
- 'on': call
  method: unlink
  effect: Odoo deletes a line while its order is in draft, sent or cancel; once the order is sale it is refused ("You can not remove an order line once the sales order is confirmed", set the quantity to 0 instead). Sections and notes (display_type set) are always deleted; a down payment line that was never invoiced is too. The revert holds every line of a confirmed order, section and note lines included
  evidence: source 19.0 sale_order_line._unlink_except_confirmed, _check_line_unlink (state sale); live 2026-10-16 t/49-documents-pack-live.t on 19 (the refusal of a line of a confirmed order and the deletion after sale.cancel)
